name: Bug report
description: Report a reproducible problem in the Kaggle T4x2 speech API
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, access tokens, private voice data, or model credentials."
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What failed and what did you expect?
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Repository revision
      placeholder: git rev-parse HEAD
    validations:
      required: true
  - type: dropdown
    id: accelerator
    attributes:
      label: Runtime
      options:
        - Kaggle Tesla T4 x2
        - CPU test environment
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact commands or API request and sanitized logs.
    validations:
      required: true
