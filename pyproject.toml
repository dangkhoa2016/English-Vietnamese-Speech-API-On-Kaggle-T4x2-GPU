[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "english-vietnamese-speech-api"
version = "1.0.0"
description = "Production-style English/Vietnamese speech REST API demo for Kaggle T4x2"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.118,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.37,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.2,<2",
  "numpy>=1.26,<3",
  "ruff>=0.14,<1",
]
translation = [
  "jax[cuda12-local]==0.12.0.1",
  "keras==3.15.1",
  "keras-hub==0.32.0",
]
speech = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/en_vi_speech_api"]
